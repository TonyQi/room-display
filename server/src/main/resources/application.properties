server.port=${PORT:8080}
server.error.include-message=never
server.tomcat.max-http-form-post-size=256KB
spring.servlet.multipart.max-file-size=256KB
spring.datasource.url=${ROOM_DATABASE_URL:jdbc:h2:file:./data/rooms;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${ROOM_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=false
room.admin-password=${ROOM_ADMIN_PASSWORD:}
room.enrollment-key=${ROOM_ENROLLMENT_KEY:}
spring.web.resources.cache.cachecontrol.max-age=1h
