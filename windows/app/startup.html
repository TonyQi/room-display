<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'"><title>房间状态管理中心</title><link rel="stylesheet" href="startup.css"></head><body><main><div class="intro"><div class="brand">▥ 房间状态</div><p class="eyebrow">WINDOWS 管理中心</p><h1>一台电脑，<br>连接每个房间。</h1><p class="lead">集中管理房间信息与使用状态。<br>设备断开连接后，仍能独立运行。</p><div class="features"><span>本机保存</span><span>局域网连接</span><span>托盘持续运行</span></div></div><section class="panel"><span class="tag">免安装 · 内置运行环境</span><h2 id="title">正在启动</h2><p id="message" class="muted">正在检查本机运行环境…</p><form id="form" hidden><div id="passwordFields"><label>管理员账户<input value="admin" disabled></label><label>设置管理密码<input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 位"></label><label>确认管理密码<input id="confirm" type="password" autocomplete="new-password" placeholder="再次输入密码"></label></div><label>设备连接端口<input id="port" type="number" min="1024" max="65535" value="8080"></label><p class="hint">通常保持 8080 即可。后续安卓端填写本机地址与此端口。</p><button type="submit" id="submit">创建管理中心</button></form><div id="loading" class="loading"><span></span>正在准备，请稍候…</div><p id="error" role="alert"></p><div class="actions"><button type="button" id="logs" class="secondary">查看运行日志</button><button type="button" id="quit" class="secondary">退出程序</button></div><p class="foot">房间数据保存在程序旁的 data 文件夹。<br>首次创建后，请用设置的密码登录。</p></section></main><script src="startup.js"></script></body></html>
